name: CI

on:
  push:
  pull_request:

jobs:
  moonbit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Update MoonBit registry
        run: moon update
      - name: Check formatting
        run: moon fmt --check
      - name: Check all stable targets
        run: moon check --target all --deny-warn
      - name: Test all stable targets
        run: moon test --target all --deny-warn
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install COCO reference evaluator
        run: python -m pip install pycocotools==2.0.7
      - name: Compare bbox metrics with pycocotools
        run: python reference_compare.py
