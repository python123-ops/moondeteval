name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  moonbit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Show MoonBit toolchain version
        run: moon version --all --no-path
      - name: Update MoonBit registry
        run: moon update
      - name: Check formatting
        run: moon fmt --check
      - name: Check all stable targets
        run: moon check --target all --deny-warn
      - name: Test all stable targets
        run: moon test --target all --deny-warn
      - name: Test read-only report viewer model
        run: node --test viewer/model.test.cjs viewer/batch.test.cjs
      - name: Test bbox and segm batch evaluation index
        run: python3 -m unittest examples/batch_eval_test.py -v
      - name: Verify metric gates and batch failure retention
        run: python3 -m unittest examples/gate_test.py -v
      - name: Verify reusable gate policies and frozen batch snapshots
        run: python3 -m unittest examples/policy_test.py -v
      - name: Verify bounded overlap caches and batch replay parity
        run: python3 -m unittest examples/scale_test.py -v
      - name: Validate release archive contents
        run: |
          moon package
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          archives = list(Path('_build/publish').glob('python123-ops-moondeteval-*.zip'))
          assert len(archives) == 1, archives
          with ZipFile(archives[0]) as archive:
              names = set(archive.namelist())
          required = {'moon.mod', 'moon.pkg', 'LICENSE', 'README.mbt.md', 'CHANGELOG.md',
                      'pkg.generated.mbti', 'box.mbt', 'mask_rle.mbt', 'mask_rle_codec.mbt',
                      'evaluation.mbt', 'evaluation_prepare.mbt', 'mask_evaluation.mbt', 'mask_coco_json.mbt',
                      'mask_polygon.mbt', 'quality_gate.mbt', 'quality_gate_json.mbt', 'THIRD_PARTY_NOTICES.md',
                      'cli/main.mbt', 'cli/evaluation_input.mbt'}
          assert required <= names, required - names
          assert not any(name.startswith(('examples/', 'viewer/', 'site/')) for name in names)
          assert not any('__pycache__' in name.split('/') or name.endswith(('.pyc', '.pyo')) for name in names)
          assert not any(name in {'AGENTS.md', 'reference_compare.py'} for name in names)
          PY
      - name: Run paired detector demo and quality gates
        run: python3 examples/compare_demo.py
      - name: Verify CLI help and positional errors
        run: python3 examples/cli_help_demo.py
      - name: Run concise showcase demo
        run: python3 examples/showcase_demo.py
      - name: Verify multi-image YOLO ingestion and mixed-format comparison
        run: python3 examples/yolo_manifest_demo.py
      - name: Verify independent consumer and MBMOT adapter
        working-directory: examples/consumer
        run: |
          moon fmt --check
          moon check --target all --deny-warn
          moon test --target all --deny-warn
      - name: Verify three exact registry packages without source workspace
        run: |
          python3 examples/consumer/registry_smoke.py --moondeteval-version 0.1.0
          python3 examples/consumer/registry_smoke.py --moondeteval-version 0.2.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install COCO reference evaluator
        run: python -m pip install numpy==1.26.4 pycocotools==2.0.7
      - name: Compare bbox metrics with pycocotools
        run: python reference_compare.py
      - name: Compare mask RLE geometry and codecs with pycocotools
        run: python examples/mask_rle_reference.py
      - name: Compare RLE mask AP with pycocotools
        run: python examples/mask_ap_reference.py
      - name: Compare COCO polygon rasterization and mask AP
        run: python examples/polygon_reference.py
      - name: Verify candidate archive independently
        run: python examples/consumer/archive_smoke.py --archive _build/publish/python123-ops-moondeteval-0.2.0.zip
      - name: Generate static product site and CLI reports
        run: python site/build.py
      - name: Install browser test tools
        run: |
          npm install --prefix _build/browser --no-save --package-lock=false playwright@1.62.1
          node _build/browser/node_modules/playwright/cli.js install --with-deps chromium
      - name: Verify bilingual site and report interactions
        env:
          NODE_PATH: ${{ github.workspace }}/_build/browser/node_modules
        run: node --test site/browser.test.cjs
      - name: Upload product site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _build/site

  pages:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: moonbit
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy product site
        id: deployment
        uses: actions/deploy-pages@v4
